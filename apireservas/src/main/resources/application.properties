spring.application.name=apireservas

server.port = 9090

spring.cloud.gateway.server.webmvc.routes[0].id="servicio-canchas"
spring.cloud.gateway.server.webmvc.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webmvc.routes[0].predicates=Path=/api/canchas/**

spring.cloud.gateway.server.webmvc.routes[1].id="servicio-reservas"
spring.cloud.gateway.server.webmvc.routes[1].uri=http://localhost:8082
spring.cloud.gateway.server.webmvc.routes[1].predicates=Path=/api/reservas/**

spring.cloud.gateway.server.webmvc.routes[2].id="servicio-usuarios"
spring.cloud.gateway.server.webmvc.routes[2].uri=http://localhost:8088
spring.cloud.gateway.server.webmvc.routes[2].predicates=Path=/api/usuarios/**